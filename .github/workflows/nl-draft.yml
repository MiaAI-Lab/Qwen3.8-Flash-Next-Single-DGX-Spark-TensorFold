name: Dutch Zig draft vocabulary validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply recipe patch stack to pinned TensorFold
        run: |
          git clone --filter=blob:none https://github.com/ashhart/TensorFold.git /tmp/tensorfold
          git -C /tmp/tensorfold checkout eab8582819688325e371907e4706e1c602b8a273
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do git -C /tmp/tensorfold apply --check "$p" && git -C /tmp/tensorfold apply "$p" || exit 1; done
      - name: Check base and Dutch ID invariants
        run: python3 tools/nl_draft_vocab.py --check
      - name: Run deterministic CPU tests
        run: python3 -m unittest discover -s tools -p 'test_nl_draft_vocab.py' -v
      - name: Python syntax and whitespace
        run: |
          python3 -m py_compile tools/nl_draft_vocab.py tools/test_nl_draft_vocab.py tools/prepare_nl_corpus.py tools/build_nl_draft_vocab.py
          git diff --check
